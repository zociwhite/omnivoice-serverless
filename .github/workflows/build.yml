name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'runpod_handler.py'
      - 'pre_download.py'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          load: true
          tags: |
            z0ci/omnivoice-serverless:latest
            z0ci/omnivoice-serverless:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}

      - name: Smoke test
        run: >
          docker run --rm z0ci/omnivoice-serverless:latest
          python -c "import torch; print('torch:'+torch.__version__); import whisperx; from omnivoice import OmniVoice; print('smoke ok')"
